name: Profile

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  metrics:
    runs-on: ubuntu-latest
    if: ${{ vars.METRICS_TOKEN != '' || github.event_name != 'schedule' }}
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_padding: 8%, 8 + 8%
          config_order: base.header, base.repositories, isocalendar, languages, notable, base.activity, base.community
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_repositories: yes
          plugin_activity: yes
          plugin_activity_days: 14
          plugin_activity_filter: commit, issue, pr, release, review

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#58a6ff&color_dots=#161b22,#30363d,#58a6ff,#1f6feb,#0e4429

      - name: Copy to assets
        run: |
          mkdir -p assets
          cp dist/snake.svg assets/snake.svg
          cp dist/snake-dark.svg assets/snake-dark.svg

      - name: Commit SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: assets/snake*.svg
          commit_message: "chore: update snake [skip ci]"